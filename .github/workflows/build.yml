name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specify a tag to build. Leave empty to build all'
        required: false
      publish:
        description: 'Push to Docker Hub'
        type: boolean
        required: false
        default: true
      sync_swr:
        description: 'Sync image to Huawei SWR'
        type: boolean
        required: false
        default: true
  push:
    branches: [ work ]
    paths:
      - 'versions.json'
      - '.github/workflows/build.yml'
      - 'Dockerfile.base'

jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -n "$TAG" ]; then
            MATRIX=$(jq -c --arg TAG "$TAG" 'with_entries(select(.key == $TAG)) | to_entries | map({tag: .key} + .value)' versions.json)
          else
            MATRIX=$(jq -c 'to_entries | map({tag: .key} + .value)' versions.json)
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        config: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      
      - name: Check disk space
        run: |
          echo "Disk space after cleanup:"
          df -h
          echo "Docker disk usage:"
          docker system df
      
      - name: Build image
        run: |
          HUB_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/mindformers:${{ matrix.config.tag }}
          
          # Determine Dockerfile
          DOCKERFILE="${{ matrix.config.DOCKERFILE }}"
          if [ -z "$DOCKERFILE" ] || [ "$DOCKERFILE" == "null" ]; then
            DOCKERFILE="Dockerfile.base"
          fi
          
          docker build -f $DOCKERFILE \
            --build-arg PYTHON_VERSION=${{ matrix.config.PYTHON_VERSION }} \
            --build-arg CANN_TOOLKIT_URL=${{ matrix.config.CANN_TOOLKIT_URL }} \
            --build-arg CANN_KERNELS_URL=${{ matrix.config.CANN_KERNELS_URL }} \
            --build-arg MS_WHL_URL=${{ matrix.config.MS_WHL_URL }} \
            --build-arg MINDFORMERS_GIT_REF=${{ matrix.config.MINDFORMERS_GIT_REF }} \
            -t $HUB_IMAGE .
          
          # Clean up dangling images after build to free space
          docker image prune -f
          
          echo "Disk space before docker save:"
          df -h
          
          docker save $HUB_IMAGE -o mindformers-${{ matrix.config.tag }}.tar
          
          echo "Disk space after docker save:"
          df -h
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindformers-${{ matrix.config.tag }}
          path: mindformers-${{ matrix.config.tag }}.tar

  push:
    if: ${{ github.event_name == 'push' || inputs.publish }}
    needs: [prepare, build]
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        config: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: mindformers-${{ matrix.config.tag }}
      - name: Load image
        run: |
          docker load -i mindformers-${{ matrix.config.tag }}.tar
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push to Docker Hub
        run: |
          HUB_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/mindformers:${{ matrix.config.tag }}
          docker push $HUB_IMAGE

  sync:
    if: ${{ github.event_name == 'push' || inputs.sync_swr }}
    needs: [prepare, push]
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        config: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to Huawei SWR
        uses: docker/login-action@v3
        with:
          registry: swr.cn-central-221.ovaijisuan.com
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}
      - name: Sync image to SWR
        run: |
          HUB_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/mindformers:${{ matrix.config.tag }}
          SWR_IMAGE=swr.cn-central-221.ovaijisuan.com/${{ secrets.SWR_ORG }}/mindformers:${{ matrix.config.tag }}
          docker pull $HUB_IMAGE
          docker tag $HUB_IMAGE $SWR_IMAGE
          docker push $SWR_IMAGE
