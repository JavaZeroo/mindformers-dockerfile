name: Build and Push Docker Images - uv (Manual Inputs)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag, e.g. r1.6.0_ms2.7.0_cann8.2rc1_py3.11'
        required: true
      PYTHON_VERSION:
        description: 'Python version, e.g. 3.11'
        required: true
      CANN_TOOLKIT_URL:
        description: 'URL to Ascend CANN Toolkit installer (.run)'
        required: true
      CANN_KERNELS_URL:
        description: 'URL to Ascend CANN Kernels installer (.run)'
        required: true
      MS_WHL_URL:
        description: 'URL to MindSpore wheel (.whl)'
        required: true
      MINDFORMERS_GIT_REF:
        description: 'mindformers git ref (branch/tag/commit), e.g. v1.2.0 or main'
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      
      - name: Check disk space
        run: |
          echo "Disk space after cleanup:"
          df -h
          echo "Docker disk usage:"
          docker system df

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Huawei SWR
        uses: docker/login-action@v3
        with:
          registry: swr.cn-central-221.ovaijisuan.com
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build image
        run: |
          HUB_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/mindformers:${{ github.event.inputs.tag }}-uv
          SWR_IMAGE=swr.cn-central-221.ovaijisuan.com/${{ secrets.SWR_ORG }}/mindformers:${{ github.event.inputs.tag }}-uv
          echo "Building $HUB_IMAGE with Dockerfile.uv (using uv package manager)"
          docker build -f Dockerfile.uv \
            --build-arg PYTHON_VERSION=${{ github.event.inputs.PYTHON_VERSION }} \
            --build-arg CANN_TOOLKIT_URL='${{ github.event.inputs.CANN_TOOLKIT_URL }}' \
            --build-arg CANN_KERNELS_URL='${{ github.event.inputs.CANN_KERNELS_URL }}' \
            --build-arg MS_WHL_URL='${{ github.event.inputs.MS_WHL_URL }}' \
            --build-arg MINDFORMERS_GIT_REF='${{ github.event.inputs.MINDFORMERS_GIT_REF }}' \
            -t "$HUB_IMAGE" .
          docker tag "$HUB_IMAGE" "$SWR_IMAGE"
          
          # Clean up dangling images after build to free space
          docker image prune -f
          
          echo "Disk space after build:"
          df -h
          
          echo "hub_image=$HUB_IMAGE" >> $GITHUB_ENV
          echo "swr_image=$SWR_IMAGE" >> $GITHUB_ENV

      - name: Push image
        run: |
          docker push ${{ env.hub_image }}
          docker push ${{ env.swr_image }}
