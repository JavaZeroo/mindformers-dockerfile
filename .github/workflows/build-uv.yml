name: Build and Push Docker Images (uv)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specify a tag to build. Leave empty to build all'
        required: false
  push:
    branches: [ work ]
    paths:
      - 'versions.json'
      - '.github/workflows/build-uv.yml'
      - 'Dockerfile.uv'

jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -n "$TAG" ]; then
            MATRIX=$(jq -c --arg TAG "$TAG" 'with_entries(select(.key == $TAG)) | to_entries | map({tag: .key} + .value)' versions.json)
          else
            MATRIX=$(jq -c 'to_entries | map({tag: .key} + .value)' versions.json)
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        config: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          # Don't remove tool-cache as it might affect builds
          tool-cache: false
          
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      
      - name: Check disk space
        run: |
          echo "Disk space after cleanup:"
          df -h
          echo "Docker disk usage:"
          docker system df
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to Huawei SWR
        uses: docker/login-action@v3
        with:
          registry: swr.cn-central-221.ovaijisuan.com
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}
      - name: Build image
        run: |
          HUB_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/mindformers:${{ matrix.config.tag }}-uv
          SWR_IMAGE=swr.cn-central-221.ovaijisuan.com/${{ secrets.SWR_ORG }}/mindformers:${{ matrix.config.tag }}-uv
          docker build -f Dockerfile.uv \
            --build-arg PYTHON_VERSION=${{ matrix.config.PYTHON_VERSION }} \
            --build-arg CANN_TOOLKIT_URL=${{ matrix.config.CANN_TOOLKIT_URL }} \
            --build-arg CANN_KERNELS_URL=${{ matrix.config.CANN_KERNELS_URL }} \
            --build-arg MS_WHL_URL=${{ matrix.config.MS_WHL_URL }} \
            --build-arg MINDFORMERS_GIT_REF=${{ matrix.config.MINDFORMERS_GIT_REF }} \
            -t $HUB_IMAGE .
          docker tag $HUB_IMAGE $SWR_IMAGE
          
          # Clean up dangling images after build to free space
          docker image prune -f
          
          echo "Disk space after build:"
          df -h
          
          echo "hub_image=$HUB_IMAGE" >> $GITHUB_ENV
          echo "swr_image=$SWR_IMAGE" >> $GITHUB_ENV
      - name: Push image
        run: |
          docker push ${{ env.hub_image }}
          docker push ${{ env.swr_image }}
